[package]
name = "angry-hub"
version = "0.4.4"
edition = "2024"
description = "A GitHub pull request dashboard."

[package.metadata.bundle]
name = "Angry Hub"
identifier = "dev.haberkamp.angryhub"
icon = [
    "assets/app-icon/32x32.png",
    "assets/app-icon/128x128.png",
    "assets/app-icon/256x256.png",
    "assets/app-icon/512x512.png",
    "assets/app-icon/512x512@2x.png",
]
resources = ["assets"]
category = "public.app-category.developer-tools"
short_description = "A GitHub pull request dashboard."
osx_minimum_system_version = "13.0"

[dependencies]
gpui = "*"
reqwest = { version = "0.12", features = ["blocking", "json"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rooter = "0.1.0"
tempfile = "3"
self_update = { version = "1.3", default-features = false, features = [
    "archive-zip",
    "compression-zip-deflate",
    "github",
    "reqwest",
    "rustls",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
keyring-core = "1"
