[package]
name = "angry-hub"
version = "2.0.0"
edition = "2024"
description = "A GitHub pull request dashboard."

[package.metadata.bundle]
name = "Angry Hub"
identifier = "dev.haberkamp.angryhub"
icon = [
    "assets/app-icon/32x32.png",
    "assets/app-icon/128x128.png",
    "assets/app-icon/256x256.png",
    "assets/app-icon/512x512.png",
    "assets/app-icon/512x512@2x.png",
]
resources = ["assets", "migrations"]
category = "public.app-category.developer-tools"
short_description = "A GitHub pull request dashboard."
osx_minimum_system_version = "13.0"

[[bin]]
name = "angry-hub"
path = "src/gpui.rs"

[dependencies]
gpui-base = "0.6"
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
homestead = "0.1.2"
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
keyring-core = "1"
